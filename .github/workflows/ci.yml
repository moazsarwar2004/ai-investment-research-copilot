name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BLACK_CACHE_DIR: .black_cache
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check Black formatting
        run: python -m black --check .

      - name: Run MyPy
        run: python -m mypy backend

      - name: Run unit and API tests
        run: python -m pytest -m "not integration"

      - name: Render Alembic migration SQL
        run: python -m alembic upgrade head --sql

  infrastructure:
    name: Infrastructure integration
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Start PostgreSQL and Redis
        run: docker compose up -d --wait

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run real infrastructure test
        env:
          RUN_INFRASTRUCTURE_TESTS: "1"
        run: python -m pytest -m integration

      - name: Show service state
        if: always()
        run: docker compose ps

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services and remove CI volumes
        if: always()
        run: docker compose down -v --remove-orphans

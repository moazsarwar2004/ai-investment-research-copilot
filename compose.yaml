name: ai-investment-research-copilot

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-copilot_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-local-migrator-only}
      APP_DATABASE_USER: ${APP_DATABASE_USER:-copilot_app}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:-local-app-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - data

  redis:
    image: redis:8.4.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - data

networks:
  data:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

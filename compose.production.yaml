name: ai-investment-research-copilot-production

x-app-environment: &app-environment
  ENVIRONMENT: production
  DEBUG: "false"
  APP_VERSION: ${APP_VERSION:?Set APP_VERSION to an immutable release identifier}
  DATABASE_URL: postgresql+asyncpg://${APP_DATABASE_USER:?Set APP_DATABASE_USER}:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
  MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_MIGRATION_USER:?Set POSTGRES_MIGRATION_USER}:${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
  TOKEN_DIGEST_KEY: ${TOKEN_DIGEST_KEY:?Set TOKEN_DIGEST_KEY}
  AUTH_EXPOSE_TEST_TOKENS: "false"
  ALLOWED_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
  ENABLE_HSTS: "true"
  DOCS_ENABLED: ${DOCS_ENABLED:-false}
  SEC_ENABLED: ${SEC_ENABLED:-false}
  SEC_USER_AGENT: ${SEC_USER_AGENT:-}
  BINANCE_SPOT_ENABLED: ${BINANCE_SPOT_ENABLED:-true}
  COINGECKO_ENABLED: ${COINGECKO_ENABLED:-true}
  COINGECKO_DEMO_API_KEY: ${COINGECKO_DEMO_API_KEY:-}
  STOCK_FUNDAMENTALS_MANIFEST_PATH: ${STOCK_FUNDAMENTALS_MANIFEST_PATH:-}

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:?Set POSTGRES_MIGRATION_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD}
      APP_DATABASE_USER: ${APP_DATABASE_USER:?Set APP_DATABASE_USER}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks: [data]

  redis:
    image: redis:8.4.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks: [data]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-ai-investment-research-copilot}:${APP_VERSION}
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [data]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-ai-investment-research-copilot}:${APP_VERSION}
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [data, web]
    logging:
      options:
        max-size: 10m
        max-file: "5"

  frontend:
    image: ${APP_IMAGE:-ai-investment-research-copilot}:${APP_VERSION}
    command:
      - streamlit
      - run
      - frontend/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      COPILOT_API_URL: http://api:8000
      COPILOT_ENVIRONMENT: production
      COPILOT_ALLOW_EDITABLE_API_URL: "false"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [web]
    logging:
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks: [web]
    logging:
      options:
        max-size: 10m
        max-file: "5"

networks:
  data:
    internal: true
  web:

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

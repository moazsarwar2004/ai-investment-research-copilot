[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investment-research-copilot"
version = "0.1.0"
description = "Production-oriented, source-backed investment research foundation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary - research and educational use" }
authors = [{ name = "AI Investment Research Co-Pilot contributors" }]
dependencies = [
    "fastapi==0.139.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "uvicorn[standard]==0.51.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | work
  | outputs
)/
'''

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv", "work", "outputs"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "S", "SIM", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"backend/app/tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
exclude = ['^work/', '^outputs/', '^\.venv/']

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["backend/app/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
